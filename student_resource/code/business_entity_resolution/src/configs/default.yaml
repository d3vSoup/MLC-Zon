# paths are relative to the student_resource/ root (override root with env BER_ROOT)
dataset_dir: dataset
work_dir: work
output_dir: output
validator: utils/validate_submission.py

seed: 42
n_folds: 5
train_s1_frac: 0.2      # LightGBM trains on this share of S1 groups; OOF predicts all
n_jobs: 16              # FIXED: LightGBM output changes with thread count (audit 2026-09-25); keep 16 on every machine

normalize:
  translit_indic: true

blocking:
  within_country: true  # phase0 item 5: zero cross-country true pairs
  max_df: 0.003         # drop tokens in more than 0.3% of docs (speed vs recall knob)
  k_fw: 10              # all tokens (name words/pairs/glued/skeleton + address words/bigrams), top-K S1 per record
  k_hh: 10              # half name + half address cosine, top-K S1 per record
  k_rv: 0               # reverse: top-K records per S1 (probe: +0.3-0.8% PC for ~+30 min/split; off)

features:
  chunk: 2000000

lgbm:
  objective: binary
  learning_rate: 0.1     # Muaz pick A (was 0.05; lgbm0 artifacts trained at 0.05)
  num_leaves: 63
  min_data_in_leaf: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  num_boost_round: 1000   # dev cycles (1000->3000 at lr 0.1: logloss -2.6%, +~1.5 h/cycle); final run: 3000
  early_stopping: 100
  test_models: 1         # v0: 1 fold model (5-model mean costs ~100 min on CPU); same calibration as OOF

round2:                 # group (graph) features + stacked model on hard pairs only
  from_model: lgbm0     # round-1 preds used as input
  name: lgbm1_r3000      # the uploaded fallback (OOF 0.9773)
  num_boost_round: 3000
  hard_p: 0.01          # round 2 re-scores pairs with round-1 p >= this (9.8M of 153M train pairs); rest keep round-1 p
  sure_p: 0.5           # siblings = records with p >= this on the same S1
  max_sib: 20

decode:
  model: lgbm1_r3000    # which preds decode/write use

ce:                     # cross-encoder (xlm-roberta-base) data export; scored on teammates' Kaggle GPUs
  from_model: lgbm1_r3000
  band_lo: 0.03         # band = lo < p < hi  OR  (rank in record < band_rank AND p >= band_floor)
  band_hi: 0.97
  band_rank: 3
  band_floor: 0.001     # drops 20M hopeless top-3 pairs: 31.1M -> 10.8M train pairs, error coverage 95.9% -> 95.8%
  cap: 600000           # training pairs per half (40% pos: half hardest; 60% neg: half hardest, quarter chain-name)
