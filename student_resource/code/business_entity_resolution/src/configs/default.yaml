# paths are relative to the student_resource/ root (override root with env BER_ROOT)
dataset_dir: dataset
work_dir: work
output_dir: output
validator: utils/validate_submission.py

seed: 42
n_folds: 5
train_s1_frac: 0.2      # LightGBM trains on this share of S1 groups; OOF predicts all
n_jobs: 16              # FIXED: LightGBM output changes with thread count (audit 2026-09-25); keep 16 on every machine

normalize:
  translit_indic: true

blocking:
  within_country: true  # phase0 item 5: zero cross-country true pairs
  max_df: 0.003         # drop tokens in more than 0.3% of docs (speed vs recall knob)
  k_fw: 10              # all tokens (name words/pairs/glued/skeleton + address words/bigrams), top-K S1 per record
  k_hh: 10              # half name + half address cosine, top-K S1 per record
  k_rv: 0               # reverse: top-K records per S1 (probe: +0.3-0.8% PC for ~+30 min/split; off)

features:
  chunk: 2000000

lgbm:
  objective: binary
  learning_rate: 0.1     # Muaz pick A (was 0.05; lgbm0 artifacts trained at 0.05)
  num_leaves: 63
  min_data_in_leaf: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  num_boost_round: 1000   # dev cycles (1000->3000 at lr 0.1: logloss -2.6%, +~1.5 h/cycle); final run: 3000
  early_stopping: 100
  test_models: 1         # v0: 1 fold model (5-model mean costs ~100 min on CPU); same calibration as OOF

round2:                 # group (graph) features + stacked model on hard pairs only
  from_model: lgbm0     # round-1 preds used as input
  name: lgbm2_ce         # FINAL (freeze 27 Sep): CE1 round 2 (OOF 0.98765); lgbm2_x = Retrain A (0.9823)
  extra: [r2_num, r2_names2]  # soft house-number + v2 name features on hard pairs (stage r2feats)
  use_ce: true          # true = add cross-encoder score (stage ce, needs ce.scores_dir files); set name to lgbm2_ce
  num_boost_round: 3000
  hard_p: 0.01          # round 2 re-scores pairs with round-1 p >= this (9.8M of 153M train pairs); rest keep round-1 p
  sure_p: 0.5           # siblings = records with p >= this on the same S1
  max_sib: 20

decode:
  model: lgbm2_ce       # which preds decode/write use (= round2.name)

ce:                     # cross-encoder (xlm-roberta-base) data export; scored on teammates' Kaggle GPUs
  from_model: lgbm1_r3000
  band_lo: 0.03         # band = lo < p < hi  OR  (rank in record < band_rank AND p >= band_floor)
  band_hi: 0.97
  band_rank: 3
  band_floor: 0.001     # drops 20M hopeless top-3 pairs: 31.1M -> 10.8M train pairs, error coverage 95.9% -> 95.8%
  cap: 600000           # training pairs per half (40% pos: half hardest; 60% neg: half hardest, quarter chain-name)
  scores_dir: code/business_entity_resolution/src/ce_scores  # ce_scores_{train,test}.parquet (s1, cand, ce_p), made by ce_ingest.collect

names2:                 # round-2 name features on a v2 name form (dotted acronyms joined, legal + stopwords out)
  generic_df: 0.001     # token in more than 0.1% of the split's S1 names = generic (data-driven, country-agnostic)

synth:                  # self-supervised synthetic pairs for unseen countries (ber.synth)
  frac: 0.5             # share of a country's S1 used as the synthetic universe
  ghost: 0.26           # share of that universe dropped from S1: their noisy copies match nothing (real: 26% of S2/S3)
  weight: 1.0           # LightGBM sample weight of synthetic rows (LOCO picks 0.3 or 1.0)

blend:                  # pair-level blend with the QTpies M5 stage-2 preds (src/razan/, shipped inputs; ber.blend)
  enabled: true         # FINAL: blend with QTpies M5 (round2.name lgbm2_ce, use_ce true, decode.model lgbm2_ce)
  dir: code/business_entity_resolution/src/razan
  w: 0.5                # fixed, not tuned (OOF flat 0.3-0.7; our side optimistic in their density-matched world)
  mode: asis            # a pair only one side scored keeps that side's p
  unseen_k: 0.18385635887853335  # FINAL: exact blend_cal France k (public 0.985131 > k 1 0.98488); auto = empty-rate matching
  extra_k: []           # no extra France files (A/B done); blend_raw (k 1) + blend_cal (auto) are still written
