# paths are relative to the student_resource/ root (override root with env BER_ROOT)
dataset_dir: dataset
work_dir: work
output_dir: output
validator: utils/validate_submission.py

seed: 42
n_folds: 5
train_s1_frac: 0.2      # LightGBM trains on this share of S1 groups; OOF predicts all
n_jobs: 16

normalize:
  translit_indic: true

blocking:
  within_country: true  # phase0 item 5: zero cross-country true pairs
  analyzer: word        # probe (US 30k queries): word 1-2gram df<=0.3% PC@10 .978 in 3s; char3-4 PC@10 .982 in 281s
  ngram: [1, 2]
  max_df: 0.003         # drop tokens in more than 0.3% of S1 docs (speed vs recall knob)
  topk_store: 15        # store this many S1 per S2/S3 record
  k: 10                 # pairs kept for features/model (set from PC@K report)

features:
  chunk: 2000000

lgbm:
  objective: binary
  learning_rate: 0.1     # Muaz pick A (was 0.05; lgbm0 artifacts trained at 0.05)
  num_leaves: 63
  min_data_in_leaf: 50
  feature_fraction: 0.8
  bagging_fraction: 0.8
  bagging_freq: 1
  lambda_l2: 1.0
  num_boost_round: 3000
  early_stopping: 100
  test_models: 1         # v0: 1 fold model (5-model mean costs ~100 min on CPU); same calibration as OOF
